name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq luajit
      - run: luajit tests/core_test.lua
      - run: luajit tests/smoke_test.lua

  version:
    name: VERSION bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-version.sh "origin/${{ github.base_ref }}"
